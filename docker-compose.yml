services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regimpact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-regimpact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regimpact}
      POSTGRES_DB: ${POSTGRES_DB:-regimpact}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regimpact} -d ${POSTGRES_DB:-regimpact}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - regimpact-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: regimpact-sl-backend:latest
    container_name: regimpact-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-regimpact}:${POSTGRES_PASSWORD:-regimpact}@db:5432/${POSTGRES_DB:-regimpact}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/src:/app/backend/src
      - ./backend/tests:/app/backend/tests
      - ./backend/.env:/app/backend/.env:ro
    networks:
      - regimpact-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: regimpact-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - regimpact-net

volumes:
  pgdata:
    driver: local

networks:
  regimpact-net:
    driver: bridge
