[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regimpact-sl"
version = "0.1.0"
description = "Context-Aware Regulatory Change Impact Analysis for Small Food Manufacturers in Sri Lanka"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
